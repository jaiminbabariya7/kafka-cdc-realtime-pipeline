[build-system]
requires = ["setuptools>=68","wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "kafka-cdc-realtime-pipeline"
version = "1.0.0"
description = "Change data capture: PostgreSQL -> Debezium -> Kafka -> BigQuery change log + tumbling-window metrics"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name="Jaimin Babariya",email="jaiminbabariya7@gmail.com"}]
keywords = ["cdc", "debezium", "kafka", "bigquery", "postgresql"]
[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = ["pytest>=7.4","pytest-cov>=4.1","black>=23.0","flake8>=6.1"]
[tool.black]
line-length = 100
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
